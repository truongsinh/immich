name: Storage URI Server Image

# Builds the server image for the noodle/storage-uri line and pushes it to
# ghcr.io/<owner>/gallery-server, tagged <version>-storage-uri-<shortsha>.
# Trimmed from gallery-release-server-only.yml: server only (the branch does
# not touch machine-learning/), no release, no floating tags.
# SOURCE_SHA pins the built tree, so this branch only carries the workflow.

on:
  push:
    branches:
      - noodle/storage-uri-image
  workflow_dispatch:

concurrency:
  group: storage-uri-server-image
  cancel-in-progress: false

permissions: {}

env:
  SOURCE_SHA: 7c55187cb5569c96f50b74cc1dc732a998fd1b2d
  VERSION: v5.8.0
  TAG_SUFFIX: storage-uri

jobs:
  build-server:
    name: Build Server (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ env.VERSION }}

      - name: Prepare names
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "platform-pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/gallery-server" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=${{ env.VERSION }}-${{ env.TAG_SUFFIX }}
            BUILD_SOURCE_COMMIT=${{ env.SOURCE_SHA }}
          outputs: type=image,"name=${{ steps.prepare.outputs.image }}",push-by-digest=true,name-resolution=short,push=true
          cache-from: type=gha,scope=storage-uri-server-${{ steps.prepare.outputs.platform-pair }}
          cache-to: type=gha,scope=storage-uri-server-${{ steps.prepare.outputs.platform-pair }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-digests-${{ steps.prepare.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-server:
    name: Merge Server Manifest
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/gallery-server"
          tag="${VERSION#v}-${TAG_SUFFIX}-${SOURCE_SHA:0:7}"
          sources=$(printf "${image}@sha256:%s " *)
          docker buildx imagetools create -t "${image}:${tag}" ${sources}
          docker buildx imagetools inspect "${image}:${tag}"
          echo "### ${image}:${tag}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' >> "$GITHUB_STEP_SUMMARY"
